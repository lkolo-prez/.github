# Reusable release workflow: automated, Conventional-Commits-driven releases via release-please (SemVer).
#
# Usage (typically on push to the default branch):
#   jobs:
#     release:
#       uses: aircloud/.github/.github/workflows/reusable-release.yml@<40-hex-sha> # vX.Y.Z
#       with:
#         release-type: simple   # simple | node | python | go | terraform-module | ...
#       permissions:
#         contents: write
#         pull-requests: write
#
# release-please opens/updates a "release PR" that aggregates Conventional Commits; merging it tags a
# SemVer release and updates the changelog. Consumers of THIS repo then bump the pinned SHA.
#
# Inputs:
#   release-type   release-please strategy (default "simple")
#   package-name   logical package name (default = repo name)
#   target-branch  branch to release from (default "main")
#   config-file    path to release-please-config.json (optional)
#   manifest-file  path to .release-please-manifest.json (optional)
#   runs-on        Runner label (default "ubuntu-24.04")
# Secrets:
#   release-token  (optional) a PAT/GitHub App token to allow release PRs to trigger downstream workflows.
#                  If omitted, the job GITHUB_TOKEN is used (note: it does not re-trigger other workflows).
name: reusable-release

on:
  workflow_call:
    inputs:
      release-type:
        required: false
        type: string
        default: "simple"
      package-name:
        required: false
        type: string
        default: ${{ github.event.repository.name }}
      target-branch:
        required: false
        type: string
        default: "main"
      config-file:
        required: false
        type: string
        default: ""
      manifest-file:
        required: false
        type: string
        default: ""
      runs-on:
        required: false
        type: string
        default: "ubuntu-24.04"
    secrets:
      release-token:
        required: false
    outputs:
      release-created:
        description: "true if a GitHub release was created in this run."
        value: ${{ jobs.release-please.outputs.release-created }}
      tag-name:
        description: "The created tag (e.g. v1.4.0), if any."
        value: ${{ jobs.release-please.outputs.tag-name }}

permissions:
  contents: read

concurrency:
  group: reusable-release-${{ github.workflow }}-${{ inputs.target-branch }}
  cancel-in-progress: false # never cancel an in-flight release

jobs:
  release-please:
    name: release-please
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: write # create tags, releases, and the release PR branch
      pull-requests: write # open/update the release PR
    outputs:
      release-created: ${{ steps.rp.outputs.release_created }}
      tag-name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: audit

      - name: Run release-please
        id: rp
        uses: googleapis/release-please-action@7987652d64b4581673a76e33ad5e98e3dd56832f # v4.1.3
        with:
          token: ${{ secrets.release-token || secrets.GITHUB_TOKEN }}
          release-type: ${{ inputs.release-type }}
          target-branch: ${{ inputs.target-branch }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
