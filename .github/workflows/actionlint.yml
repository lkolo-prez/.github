# Lint THIS repo's workflows (including the reusable ones) with actionlint + zizmor + yamllint, and verify
# that every `uses:` is pinned to a full 40-hex commit SHA. This is the gate that keeps the org templates honest.
name: actionlint

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "examples/**"
      - ".github/actionlint.yaml"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "examples/**"
      - ".github/actionlint.yaml"

permissions:
  contents: read

concurrency:
  group: actionlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint + zizmor + SHA-pin check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write          # reviewdog github-check reporter (actionlint annotations)
      security-events: write # zizmor SARIF upload
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: actionlint
        uses: reviewdog/action-actionlint@a5524e1c19e62881d79c1f1b9b6f09f16356e281 # v1.65.0
        with:
          reporter: github-check
          fail_level: error

      - name: Verify all actions are pinned to a 40-hex SHA
        run: |
          set -euo pipefail
          # Find any `uses:` that is NOT a local action (./) nor pinned to a 40-hex SHA.
          if grep -rEn '^\s*uses:\s*' .github/workflows examples 2>/dev/null \
              | grep -vE 'uses:\s*\./' \
              | grep -vE 'uses:\s*[^@]+@[0-9a-f]{40}(\s|$|#)'; then
            echo "::error::Found action references not pinned to a full 40-hex commit SHA (see above)."
            exit 1
          fi
          echo "All action references are SHA-pinned."

      - name: Setup Python (for zizmor)
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Install zizmor
        run: pip install zizmor==1.0.0

      - name: Run zizmor (workflow security audit)
        run: zizmor --format sarif .github/workflows examples > zizmor.sarif || true

      - name: Upload zizmor SARIF
        if: always() && hashFiles('zizmor.sarif') != ''
        uses: github/codeql-action/upload-sarif@ea9e4e37992a54ee68a9622e985e60c8e8f12d9f # v3.27.4
        with:
          sarif_file: zizmor.sarif
          category: zizmor
