# Reusable CodeQL static analysis workflow.
#
# Usage:
#   jobs:
#     codeql:
#       uses: aircloud/.github/.github/workflows/reusable-codeql.yml@<40-hex-sha> # vX.Y.Z
#       with:
#         languages: '["javascript-typescript","python"]'
#       permissions:
#         contents: read
#         security-events: write
#         actions: read
#
# Inputs:
#   languages   JSON array string of CodeQL languages
#               (e.g. '["go"]', '["javascript-typescript","python"]').  Required.
#   queries     Query suite: default | security-extended | security-and-quality  (default security-extended)
#   build-mode  none | autobuild | manual  (default none; use autobuild/manual for compiled langs)
#   runs-on     Runner label  (default ubuntu-24.04)
# Secrets: none.
name: reusable-codeql

on:
  workflow_call:
    inputs:
      languages:
        description: 'JSON array of CodeQL languages, e.g. ["go"]'
        required: true
        type: string
      queries:
        required: false
        type: string
        default: security-extended
      build-mode:
        required: false
        type: string
        default: none
      runs-on:
        required: false
        type: string
        default: "ubuntu-24.04"

permissions:
  contents: read

concurrency:
  group: reusable-codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
      actions: read # read workflow run metadata for private repos
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ea9e4e37992a54ee68a9622e985e60c8e8f12d9f # v3.27.4
        with:
          languages: ${{ matrix.language }}
          queries: ${{ inputs.queries }}
          build-mode: ${{ inputs.build-mode }}

      # For build-mode: manual, the consumer should override this workflow or set autobuild.
      - name: Autobuild
        if: inputs.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@ea9e4e37992a54ee68a9622e985e60c8e8f12d9f # v3.27.4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@ea9e4e37992a54ee68a9622e985e60c8e8f12d9f # v3.27.4
        with:
          category: "/language:${{ matrix.language }}"
